spring.application.name=turnobanco
server.port=8080

# Configuracion de Conexion a SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BD_TurnoBanco;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456780101
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
